---
name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Dependabot auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: pull_request_target grants a write token, so untrusted PR
      # code must never be fetched or executed here.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Fail closed unless the active rules for main require the aggregate CI
      # check. The only preflight API request reads paginated rules metadata.
      - name: Verify aggregate CI check is required on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECK: Test, lint, and package
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/branch-protection"
          mkdir -p "$work"

          if ! gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/rules/branches/main?per_page=100" \
            > "$work/main-rule-pages.json"; then
            echo "::error::Could not read active main rules metadata; grant read access. " \
              "Auto-merge was not enabled."
            exit 1
          fi
          jq 'add // []' "$work/main-rule-pages.json" > "$work/main-rules.json"

          if ! jq -e --arg check "$REQUIRED_CHECK" '
            any(.[]?;
              .type == "required_status_checks" and
              any(.parameters.required_status_checks[]?; .context == $check)
            )
          ' "$work/main-rules.json" > /dev/null; then
            echo "::error::Require '$REQUIRED_CHECK' in an active ruleset applying to main. " \
              "Auto-merge was not enabled."
            exit 1
          fi
          echo "Verified that main requires: $REQUIRED_CHECK"

      # Only queues the merge. The ruleset holds it until required checks pass.
      # AUTO_MERGE_TOKEN needs Workflows write for PRs touching workflow files.
      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set AUTO_MERGE_TOKEN to a fine-grained token with Contents, " \
              "Pull requests, and Workflows write access. Auto-merge was not enabled."
            exit 1
          fi
          gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
