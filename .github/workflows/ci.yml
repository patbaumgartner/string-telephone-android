---
name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and package
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 27
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Validate YAML and shell scripts
        run: |
          pipx install yamllint
          yamllint .
          find . -name '*.sh' -not -path './*/build/*' -exec shellcheck {} +

      - name: Validate repository contracts and deployment helpers
        run: |
          node scripts/check-adrs.mjs
          node scripts/check-secrets.mjs
          node --test scripts/test-deploy.mjs scripts/test-admin-ui.mjs

      - name: Test, lint, and package
        run: >-
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleRelease :server:api:test :server:api:installDist

      - name: Verify installed provisioning commands
        run: node --test scripts/test-provisioning.mjs

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
            core/build/reports/
            core/build/test-results/
            server/api/build/reports/
            server/api/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
