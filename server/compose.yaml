---
name: st-proto

services:
  asterisk:
    build: ./asterisk
    ports:
      - "5060:5060/udp"
      - "5061:5061/tcp"
      - "10000-10100:10000-10100/udp"
    environment:
      # auto enables SIP/TLS on 5061 when certificates are mounted below,
      # otherwise the PBX stays UDP-only.
      PJSIP_TLS_ENABLE: ${PJSIP_TLS_ENABLE:-auto}
      PBX_AMI_USERNAME: ${PBX_AMI_USERNAME:-stringtelephone}
      PBX_AMI_PASSWORD: ${PBX_AMI_PASSWORD:?Set PBX_AMI_PASSWORD in your environment or .env}
    volumes:
      # PEM certs (fullchain.pem + privkey.pem) for the TLS transport. Mount an
      # empty directory (the default) to keep TLS off.
      - ${ST_CERTS_DIR:-./certs}:/certs:ro
      - pbx-config:/managed
    networks:
      - pbx
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-stringtelephone}
      POSTGRES_USER: ${DB_USER:-stringtelephone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env}
    volumes:
      # PostgreSQL 18 image layout: mount the parent directory, data lives in
      # a versioned subdirectory (see docker-library/postgres#37).
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 probes the real TCP listener, not the entrypoint's
      # temporary setup socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-stringtelephone} -d ${DB_NAME:-stringtelephone}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - pbx

  api:
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    environment:
      # PostgreSQL connection (ADR-0008) — replaces the former file-database
      # settings.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-stringtelephone}
      DB_USER: ${DB_USER:-stringtelephone}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in your environment or .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your environment or .env}
      PBX_AMI_HOST: asterisk
      PBX_AMI_USERNAME: ${PBX_AMI_USERNAME:-stringtelephone}
      PBX_AMI_PASSWORD: ${PBX_AMI_PASSWORD:?Set PBX_AMI_PASSWORD in your environment or .env}
      ASTERISK_MANAGED_DIR: /managed
      # Native HTTPS/WSS is opt-in: point API_TLS_KEYSTORE at a PKCS12/JKS
      # keystore (e.g. /certs/api-keystore.p12) to add the 8443 listener.
      # Leave unset when a TLS-terminating proxy fronts the API. The plain
      # 8080 listener is always started regardless.
      API_HTTPS_PORT: "8443"
      API_TLS_KEYSTORE: ${API_TLS_KEYSTORE:-}
      API_TLS_KEYSTORE_PASSWORD: ${API_TLS_KEYSTORE_PASSWORD:-}
      API_TLS_KEYSTORE_TYPE: ${API_TLS_KEYSTORE_TYPE:-PKCS12}
      API_TLS_KEY_ALIAS: ${API_TLS_KEY_ALIAS:-}
      API_TLS_KEY_PASSWORD: ${API_TLS_KEY_PASSWORD:-}
    healthcheck:
      # /ready checks PostgreSQL, not just the process.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${ST_API_HTTP_BIND:-127.0.0.1}:${ST_API_HTTP_PORT:-8080}:8080"
      - "${ST_API_HTTPS_PORT:-8443}:8443"
    volumes:
      # Read-only certs / optional keystore for native TLS.
      - ${ST_CERTS_DIR:-./certs}:/certs:ro
      - pbx-config:/managed
    depends_on:
      asterisk:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pbx

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      # Cluster credentials never live in the repository. The RPC secret is
      # required for Garage to start (`openssl rand -hex 32`); the admin
      # token guards the administration API and is optional.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3902:3902"
    networks:
      - pbx

volumes:
  db-data:
  pbx-config:
  garage-meta:
  garage-data:

networks:
  pbx:
