[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Optional SIP-over-TLS transport on 5061. Generated at container start by
; docker-entrypoint.sh from mounted certificates; empty (commented) when no
; certs are present, so this include never fails.
#include pjsip-tls.conf

; AOR names must match the To-header user part of REGISTERs (the Asterisk
; registrar resolves the AOR from the To user). Endpoint names equal the
; provisioned username; auth sections carry the digest credentials.
; Per-account endpoint/auth/aor sections are generated by the provisioning
; CLI into pjsip.d/*.conf and included from sorcery or this file at start.

[endpoint-basic](!)
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw
direct_media=no
dtmf_mode=rfc4733

[auth-basic](!)
type=auth
auth_type=userpass

[aor-basic](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

[alice](endpoint-basic)
auth=alice-auth
aors=alice

[alice-auth]
type=auth
auth_type=userpass
username=alice
password=prototest-alice-pass

[alice](aor-basic)

[bob](endpoint-basic)
auth=bob-auth
aors=bob

[bob-auth]
type=auth
auth_type=userpass
username=bob
password=prototest-bob-pass

[bob](aor-basic)
