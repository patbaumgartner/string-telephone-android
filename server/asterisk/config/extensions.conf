; String Telephone dial plan.
; Only authenticated, provisioned endpoints may dial each other by
; provisioned username. No anonymous context, no pattern-based routing to
; external destinations, no PSTN.

[default]
exten => _X.,1,NoOp(default deny)
same => n,Hangup()

[from-internal]
exten => bob,1,Dial(PJSIP/bob,30)
same => n,Hangup()
exten => alice,1,Dial(PJSIP/alice,30)
same => n,Hangup()
