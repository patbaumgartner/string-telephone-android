server.port=${API_PORT:8080}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

spring.application.name=String Telephone
spring.thymeleaf.cache=true
spring.servlet.multipart.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# PostgreSQL connection (ADR-0008). The password has no default: Spring Boot
# fails startup on an unresolved placeholder, so DB_PASSWORD is as mandatory
# as ADMIN_PASSWORD and PBX_AMI_PASSWORD. spring.datasource.type pins HikariCP;
# Flyway auto-configuration applies db/migration before the app serves traffic.
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stringtelephone}
spring.datasource.username=${DB_USER:stringtelephone}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

# Readiness/health: /health stays a pure process liveness check, /ready and
# /actuator/health add a database probe so a dead DataSource cannot report ok.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
st.admin.username=${ADMIN_USERNAME:}
st.admin.password=${ADMIN_PASSWORD:}

st.pbx.directory=${ASTERISK_MANAGED_DIR:data/pbx}
st.pbx.host=${PBX_AMI_HOST:asterisk}
st.pbx.port=${PBX_AMI_PORT:5038}
st.pbx.username=${PBX_AMI_USERNAME:stringtelephone}
st.pbx.require-tls=${PBX_REQUIRE_TLS:false}
st.pbx.password=${PBX_AMI_PASSWORD:}

logging.level.org.apache.tomcat.util.net=warn
