server.port=${API_PORT:8080}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never

spring.application.name=String Telephone
spring.thymeleaf.cache=true
spring.servlet.multipart.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=false

st.database=${API_DB:data/stringtelephone.db}
st.admin.username=${ADMIN_USERNAME:}
st.admin.password=${ADMIN_PASSWORD:}

st.pbx.directory=${ASTERISK_MANAGED_DIR:data/pbx}
st.pbx.host=${PBX_AMI_HOST:asterisk}
st.pbx.port=${PBX_AMI_PORT:5038}
st.pbx.username=${PBX_AMI_USERNAME:stringtelephone}
st.pbx.password=${PBX_AMI_PASSWORD:}

logging.level.org.apache.tomcat.util.net=warn
